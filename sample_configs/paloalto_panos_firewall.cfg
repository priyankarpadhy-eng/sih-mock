# ==============================================================================
# PALO ALTO NETWORKS (PAN-OS) NEXT-GENERATION FIREWALL
# Device: PA-3200 Series High-Capacity Security Gateway
# Software Version: PAN-OS 10.2.4 Enterprise
# Platform: PA-3220 Chassis | Hardware Serial: 013401004812
# Export: show config running (CLI Set Command Format)
# ==============================================================================

set deviceconfig system hostname PA-3200-PERIMETER-FW01
set deviceconfig system os-version 10.2.4
set deviceconfig system domain internal.corp.net
set deviceconfig system ip-address 10.0.50.10 netmask 255.255.255.0
set deviceconfig system default-gateway 10.0.50.1
set deviceconfig system dns-setting servers primary 10.0.1.10 secondary 10.0.1.11
set deviceconfig system ntp-servers primary-ntp-server ntp-server-address 10.0.1.1
set deviceconfig system timezone UTC
set deviceconfig system login-banner "================================================================================\n   *** WARNING: AUTHORIZED GOVERNMENT & MILITARY CONTRACTOR ACCESS ONLY ***\n   ALL TRAFFIC IS INSPECTED AND LOGGED IN ACCORDANCE WITH CERT-IN & NIST SC-8\n================================================================================"

# Insecure Service Settings & Timeout Configuration
set deviceconfig system service disable-telnet no
set deviceconfig system service disable-http yes
set deviceconfig system idle-timeout 15
set deviceconfig system ssh-cipher ciphers [ aes256-gcm aes128-gcm aes256-ctr ]
set deviceconfig system ssh-mac macs [ hmac-sha2-512 hmac-sha2-256 ]

# SNMP Community Settings
set deviceconfig system snmp-setting version v2c
set deviceconfig system snmp-setting community public

# Central Syslog & SIEM Log Forwarding Profile
set shared log-settings syslog SEC-CENTRAL-SIEM server SIEM-COLLECTOR-01 server 10.0.50.100 transport UDP port 514 format BSD facility LOG_USER
set shared log-settings system match-list ALL-SYSTEM-EVENTS send-syslog SEC-CENTRAL-SIEM
set shared log-settings config match-list ALL-AUDIT-LOGS send-syslog SEC-CENTRAL-SIEM

# User Authentication & Administrative Access
set mgt-config users admin password plainadmin123
set mgt-config users admin permissions role-based superuser yes
set mgt-config users secops phash $1$q983$kLs837FnKlp24NvxM981a/
set mgt-config users secops permissions role-based superuser yes

# Network Interfaces & Zones
set network interface ethernet ethernet1/1 layer3 ip 203.0.113.2/29
set network interface ethernet ethernet1/1 comment "External Internet Uplink - ISP1"
set network interface ethernet ethernet1/2 layer3 ip 10.10.1.1/24
set network interface ethernet ethernet1/2 comment "Internal Trusted Core LAN"
set network interface ethernet ethernet1/3 layer3 ip 172.16.50.1/24
set network interface ethernet ethernet1/3 comment "Demilitarized DMZ Segment"

set zone UNTRUST network layer3 ethernet1/1
set zone TRUST network layer3 ethernet1/2
set zone DMZ network layer3 ethernet1/3

# Security Profiles: Antivirus, Vulnerability, Anti-Spyware
set profiles virus STRICT-AV decoder http action reset-both
set profiles vulnerability STRICT-IPS rule 1 action reset-both
set profiles spyware STRICT-SPYWARE botnet-domains action sinkhole

# Security Policy Rulebase
set rulebase security rules "ALLOW-INTERNAL-OUTBOUND" from TRUST to UNTRUST source any destination any application [ web-browsing ssl dns ping ] action allow log-end yes log-setting SEC-CENTRAL-SIEM
set rulebase security rules "ALLOW-DMZ-PUBLIC-HTTPS" from UNTRUST to DMZ source any destination 172.16.50.10 application ssl action allow profile-setting profiles vulnerability STRICT-IPS log-end yes
set rulebase security rules "DENY-ALL-OTHER-UNTRUST" from UNTRUST to any source any destination any application any action drop log-end yes
