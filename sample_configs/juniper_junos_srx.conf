## ==============================================================================
## JUNIPER JUNOS SERVICES GATEWAY RUNNING CONFIGURATION
## Device: Juniper SRX340 Enterprise Services Gateway / Security Gateway
## OS: Junos OS 21.4R1-S2.4 | Exported: show configuration
## Serial: JN1182F091A | Architecture: Junos SRX Security Platform
## ==============================================================================

version 21.4R1.12;

system {
    host-name SRX-BORD-SEC-01;
    domain-name enterprise.corp.net;
    time-zone UTC;
    root-authentication {
        encrypted-password "$6$v98J2$pL0vN1XqVz7.T0sQG.oD7R1cKl0oF8tH4yvU5mK3b2w";
    }
    name-server {
        10.100.1.10;
        10.100.1.11;
    }
    login {
        message "================================================================================\n   *** WARNING: AUTHORIZED PERSONNEL ONLY ***\n   ALL ACCESS IS RECORDED AND AUDITED UNDER CERT-IN DIRECTIVES.\n================================================================================";
        idle-timeout 10;
        retry-options {
            tries-before-disconnect 5;
            backoff-threshold 3;
            backoff-factor 5;
        }
        user admin {
            uid 2001;
            class super-user;
            authentication {
                encrypted-password "$6$k8Lm1$qP9xW2zE5rT8yU1iO4pA7sD0fG3hJ6kL9zX2cV5bN8";
            }
        }
        user netops-audit {
            uid 2004;
            class read-only;
            authentication {
                plain-text-password "AuditorFallback2026!";
            }
        }
    }
    services {
        ssh {
            protocol-version v2;
            max-pre-authentication-packets 10;
            rate-limit 3;
            ciphers [ aes256-gcm@openssh.com chacha20-poly1305@openssh.com aes256-ctr ];
            macs [ hmac-sha2-512-etm@openssh.com hmac-sha2-256-etm@openssh.com ];
        }
        telnet;
        web-management {
            http {
                interface ge-0/0/0.0;
            }
            https {
                system-generated-certificate;
                interface [ ge-0/0/1.0 fxp0.0 ];
            }
        }
    }
    syslog {
        host 10.100.20.50 {
            any any;
            authorization info;
            structured-data;
        }
        file messages {
            any notice;
            authorization info;
        }
        file interactive-commands {
            interactive-commands any;
        }
    }
    ntp {
        server 10.100.1.1 prefer;
        server 10.100.1.2;
    }
}

interfaces {
    ge-0/0/0 {
        description "WAN Uplink - Primary ISP Provider";
        unit 0 {
            family inet {
                address 198.51.100.10/30;
            }
        }
    }
    ge-0/0/1 {
        description "Internal LAN Trunk to Distribution Core";
        unit 0 {
            family inet {
                address 10.50.1.1/24;
            }
        }
    }
    ge-0/0/2 {
        description "DMZ Server Farm Segment";
        unit 0 {
            family inet {
                address 172.16.100.1/24;
            }
        }
    }
    fxp0 {
        description "Out-of-Band Dedicated Management Port";
        unit 0 {
            family inet {
                address 10.250.1.50/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                filter {
                    input RE-PROTECT-FILTER;
                }
                address 10.255.255.2/32;
            }
        }
    }
}

firewall {
    family inet {
        filter RE-PROTECT-FILTER {
            term allow-bgp {
                from {
                    source-address {
                        198.51.100.9/32;
                    }
                    protocol tcp;
                    port bgp;
                }
                then accept;
            }
            term allow-ntp-snmp {
                from {
                    source-address {
                        10.100.1.0/24;
                        10.100.20.50/32;
                    }
                    protocol udp;
                    port [ ntp snmp ];
                }
                then accept;
            }
            term default-deny {
                then {
                    count discarded-mgmt-packets;
                    log;
                    discard;
                }
            }
        }
    }
}

security {
    screen {
        ids-option untrust-screen {
            icmp {
                ping-death;
            }
            ip {
                source-route-option;
                tear-drop;
            }
            tcp {
                syn-flood {
                    alarm-threshold 1024;
                    attack-threshold 200;
                    source-threshold 1000;
                    destination-threshold 2048;
                    timeout 20;
                }
                land;
            }
        }
    }
    zones {
        security-zone trust {
            address-book {
                address LAN-SUBNET 10.50.1.0/24;
            }
            host-inbound-traffic {
                system-services {
                    ping;
                    traceroute;
                }
                protocols {
                    ospf;
                }
            }
            interfaces {
                ge-0/0/1.0;
            }
        }
        security-zone untrust {
            screen untrust-screen;
            interfaces {
                ge-0/0/0.0;
            }
        }
        security-zone dmz {
            address-book {
                address WEB-SERVERS 172.16.100.0/24;
            }
            interfaces {
                ge-0/0/2.0;
            }
        }
    }
    policies {
        from-zone trust to-zone untrust {
            policy PERMIT-OUTBOUND-INTERNET {
                match {
                    source-address LAN-SUBNET;
                    destination-address any;
                    application [ junos-http junos-https junos-dns-udp ];
                }
                then {
                    permit;
                    log {
                        session-close;
                    }
                }
            }
        }
        from-zone untrust to-zone dmz {
            policy PERMIT-INBOUND-PUBLIC-WEB {
                match {
                    source-address any;
                    destination-address WEB-SERVERS;
                    application [ junos-https ];
                }
                then {
                    permit;
                }
            }
        }
        default-policy {
            deny-all;
        }
    }
}

snmp {
    location "Primary Data Center - SRX Cluster Node 1";
    contact "NOC Security Engineering <security@enterprise.corp.net>";
    community public {
        authorization read-only;
        clients {
            10.100.20.50/32;
        }
    }
}
