! ==============================================================================
! CISCO IOS-XE ENTERPRISE CORE ROUTER CONFIGURATION
! Device: Cisco ISR 4451-X / Catalyst 8300 Edge Gateway
! OS: Cisco IOS-XE Software, Version 16.09.04
! Chassis Serial: FOC22340A18 | Compiled: Mon 14-Mar-22 17:02 by mcpre
! ==============================================================================
version 16.9
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
service call-home
platform qfp utilization monitor load 80
no platform punt-keepalive disable-kernel-core
!
hostname RTR-NYC-CORE-01
!
boot-start-marker
boot system flash bootflash:packages.conf
boot-end-marker
!
vrf definition MGMT
 description Out-Of-Band Management Isolation VRF
 !
 address-family ipv4
 exit-address-family
 !
 address-family ipv6
 exit-address-family
!
aaa new-model
!
aaa group server tacacs+ TACACS-CLUSTER
 server name TACACS-PRIMARY
 server name TACACS-SECONDARY
 ip tacacs source-interface GigabitEthernet0/0/2
!
aaa authentication login default group TACACS-CLUSTER local
aaa authentication enable default group TACACS-CLUSTER enable
aaa authorization exec default group TACACS-CLUSTER local 
aaa accounting exec default start-stop group TACACS-CLUSTER
aaa accounting commands 15 default start-stop group TACACS-CLUSTER
!
enable secret 5 $1$mER7$vX3Y80x1g0f7
enable password 7 0822455D0A16
!
username secops-admin privilege 15 secret 5 $1$f802$K3rN3lPr0t3ct89x
username netbackup-svc privilege 5 password 7 0822455D0A16
!
ip domain name enterprise-corp.net
ip domain lookup
ip name-server 10.200.1.10 10.200.1.11
ip cef
ipv6 unicast-routing
!
login block-for 180 attempts 5 within 60
login on-failure log
login on-success log
!
archive
 log config
  logging enable
  hidekeys
 path bootflash:archive-config-backup
 write-memory
!
interface Loopback0
 description System Management Router-ID Loopback
 ip address 10.255.255.1 255.255.255.255
 no ip redirects
 no ip unreachables
 no ip proxy-arp
!
interface GigabitEthernet0/0/0
 description WAN-PRIMARY-ISP1-ATT-DIA-1GBPS
 ip address 198.51.100.2 255.255.255.252
 ip access-group WAN-INSPECT-IN in
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 duplex full
 speed 1000
 negotiation auto
 no shutdown
!
interface GigabitEthernet0/0/1
 description LAN-CORE-TRUNK-TO-DIST-SWITCH-01
 ip address 10.10.10.1 255.255.255.0
 ip ospf 100 area 0
 ip ospf message-digest-key 1 md5 CiscoOspfAuthKey2026
 duplex full
 speed 1000
 negotiation auto
 no shutdown
!
interface GigabitEthernet0/0/2
 description OOB-OUT-OF-BAND-SECURE-MGMT
 vrf forwarding MGMT
 ip address 10.250.0.15 255.255.255.0
 no ip redirects
 no ip proxy-arp
 negotiation auto
 no shutdown
!
router ospf 100
 router-id 10.255.255.1
 auto-cost reference-bandwidth 10000
 passive-interface GigabitEthernet0/0/0
 area 0 authentication message-digest
 network 10.10.10.0 0.0.0.255 area 0
 network 10.255.255.1 0.0.0.0 area 0
!
router bgp 65001
 bgp router-id 10.255.255.1
 bgp log-neighbor-changes
 neighbor 198.51.100.1 remote-as 7018
 neighbor 198.51.100.1 description ATT-BGP-PEER
 neighbor 198.51.100.1 password 7 14141B180F0B
 !
 address-family ipv4
  neighbor 198.51.100.1 activate
  neighbor 198.51.100.1 route-map BGP-ISP-FILTER in
  network 10.10.0.0 mask 255.255.0.0
 exit-address-family
!
ip forward-protocol nd
no ip http server
ip http secure-server
ip http client source-interface GigabitEthernet0/0/2
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip scp server enable
!
logging buffered 64000 informational
logging console critical
logging monitor informational
logging source-interface Loopback0
logging host 10.200.5.50
logging host 10.200.5.51
!
snmp-server community public RO 99
snmp-server community private RW 99
snmp-server location "NYC Datacenter - Facility 1, Floor 2, Rack 14B"
snmp-server contact "SOC Operations Team <soc@enterprise-corp.net>"
snmp-server enable traps snmp authentication linkdown linkup
snmp-server host 10.200.5.50 version 2c public 
!
banner motd ^C
================================================================================
   *** WARNING: AUTHORIZED MILITARY / ENTERPRISE ACCESS ONLY ***
   UNAUTHORIZED ACCESS IS PROHIBITED BY 18 U.S.C. 1030 AND CERT-IN DIRECTIVES.
   ALL SESSIONS ARE ACTIVELY LOGGED, RECORDED, AND AUDITED.
================================================================================
^C
!
ip access-list standard 23
 remark Permit Only Management Bastion Hosts
 permit 10.250.0.0 0.0.0.255
 permit 10.200.10.15
 deny any log
!
ip access-list standard 99
 remark Permit SNMP Read/Write From Authorized NMS Only
 permit 10.200.5.50
 permit 10.200.5.51
 deny any log
!
ip access-list extended WAN-INSPECT-IN
 remark Deny RFC 1918 Private Addresses Inbound from WAN (Anti-Spoofing)
 deny ip 10.0.0.0 0.255.255.255 any log
 deny ip 172.16.0.0 0.15.255.255 any log
 deny ip 192.168.0.0 0.0.255.255 any log
 permit tcp any host 198.51.100.2 eq bgp
 permit icmp any host 198.51.100.2 echo
 permit icmp any host 198.51.100.2 echo-reply
 deny ip any any log
!
line con 0
 exec-timeout 10 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 no exec
 transport input none
line vty 0 4
 access-class 23 in
 exec-timeout 10 0
 logging synchronous
 login authentication default
 transport input telnet ssh
line vty 5 15
 access-class 23 in
 exec-timeout 10 0
 logging synchronous
 login authentication default
 transport input ssh
!
ntp source Loopback0
ntp server 10.200.1.1 prefer
ntp server 10.200.1.2
!
end
