# ==============================================================================
# FORTINET FORTIGATE NEXT-GENERATION ENTERPRISE FIREWALL
# Device: FortiGate-100F Enterprise Appliance
# Firmware: FortiOS v7.2.4 GA (Build 1396)
# Serial Number: FG100FTK21049281 | Mode: Route/NAT (Standalone)
# Export: Backup Configuration
# ==============================================================================

#config-version=FG100F-7.2.4-FW-build1396-230302:opmode=0:vdom=0:user=admin
#date=2026-09-24 time=10:15:22

config system global
    set hostname "FGT-100F-CORP-EDGE"
    set admintimeout 10
    set admin-sport 8443
    set admin-ssh-port 22
    set admin-https-redirect enable
    set admin-lockout-threshold 3
    set admin-lockout-duration 300
    set pre-login-banner enable
    set gui-theme mariner
    set timezone 04
end

config system accprofile
    edit "super_admin_ro"
        set secfabread enable
        set ftviewgrp read
        set authgrp read
        set sysgrp read
        set netgrp read
        set loggrp read
        set fgtgrp read
    next
end

config system admin
    edit "admin"
        set accprofile "super_admin"
        set vdom "root"
        set password-expire-warning 7
    next
    edit "auditor"
        set accprofile "super_admin_ro"
        set vdom "root"
        set trusthost1 10.0.100.0 255.255.255.0
    next
end

config system interface
    edit "wan1"
        set vdom "root"
        set mode static
        set ip 198.51.100.50 255.255.255.248
        set allowaccess ping
        set type physical
        set description "Primary ISP Fiber Uplink - 1Gbps DIA"
        set snmp-index 1
    next
    edit "wan2"
        set vdom "root"
        set mode dhcp
        set status down
        set type physical
        set description "Secondary Backup Broadband Link"
        set snmp-index 2
    next
    edit "port1"
        set vdom "root"
        set mode static
        set ip 10.0.1.1 255.255.255.0
        set allowaccess ping https ssh telnet
        set type physical
        set description "Corporate LAN Backbone & Management Trunk"
        set snmp-index 3
    next
    edit "port2"
        set vdom "root"
        set mode static
        set ip 172.16.20.1 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set description "Secure DMZ Application Segment"
        set snmp-index 4
    next
end

config system dns
    set primary 10.0.10.10
    set secondary 10.0.10.11
    set protocol cleartext
end

config system ntp
    set ntpserver "10.0.10.1"
    set type custom
    set status enable
    set syncinterval 60
end

config log syslogd setting
    set status enable
    set server "10.0.100.50"
    set mode udp
    set port 514
    set facility local7
    set source-ip "10.0.1.1"
end

config system snmp community
    edit 1
        set name "public"
        set status enable
        config hosts
            edit 1
                set ip 10.0.100.50 255.255.255.255
            next
        end
    next
end

config firewall address
    edit "LAN_SUBNET_10_0_1_0"
        set subnet 10.0.1.0 255.255.255.0
        set comment "Internal Corporate Users"
    next
    edit "DMZ_SERVERS_172_16_20_0"
        set subnet 172.16.20.0 255.255.255.0
        set comment "Public Facing DMZ Infrastructure"
    next
    edit "SIEM_COLLECTOR"
        set subnet 10.0.100.50 255.255.255.255
        set comment "Central SIEM & Log Server"
    next
end

config firewall addrgrp
    edit "INTERNAL_PROTECTED_NETWORKS"
        set member "LAN_SUBNET_10_0_1_0" "DMZ_SERVERS_172_16_20_0"
    next
end

config firewall service custom
    edit "TCP_8443_MGT"
        set tcp-portrange 8443
    next
end

config firewall policy
    edit 1
        set name "CORP-OUTBOUND-INTERNET"
        set srcintf "port1"
        set dstintf "wan1"
        set srcaddr "LAN_SUBNET_10_0_1_0"
        set dstaddr "all"
        set action accept
        set status enable
        set schedule "always"
        set service "ALL"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set nat enable
    next
    edit 2
        set name "INBOUND-DMZ-HTTPS"
        set srcintf "wan1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "DMZ_SERVERS_172_16_20_0"
        set action accept
        set status enable
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
    next
    edit 3
        set name "DEFAULT-DENY-ALL"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end

config router static
    edit 1
        set gateway 198.51.100.49
        set device "wan1"
        set comment "Default Default Gateway via ISP1"
    next
end
