version: '3.8'

services:
  # 1. PostgreSQL 16 + pgvector Database Engine
  db:
    container_name: sentinel-db
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinelpass
      POSTGRES_DB: sentinel_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. Redis Caching & Message Queue
  redis:
    container_name: sentinel-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # 3. Sentinel-Net FastAPI Compliance & AI Engine
  backend:
    container_name: sentinel-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://sentinel:sentinelpass@db:5432/sentinel_db
      - REDIS_URL=redis://redis:6379/0
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # 4. Sentinel-Net Next.js Cyber Command Web Interface
  frontend:
    container_name: sentinel-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
