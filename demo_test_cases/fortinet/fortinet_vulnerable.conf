# ==============================================================================
# FORTINET FORTIOS — VULNERABLE CONFIGURATION (WITH COMPLIANCE VIOLATIONS)
# Contains: Cleartext HTTP/Telnet management, infinite timeout, missing lockout
# ==============================================================================
config system global
    set hostname "FGT-SEC-VULN"
    set admintimeout 0
    set pre_login_banner disable
end

