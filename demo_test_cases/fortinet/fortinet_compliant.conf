# ==============================================================================
# FORTINET FORTIOS — 100% HARDENED & COMPLIANT BENCHMARK CONFIGURATION
# Meets NIST SP 800-53, CIS Benchmark, and DISA STIG guidelines
# ==============================================================================
config system global
    set hostname "FGT-SEC-CLEAN"
    set admintimeout 5
    set admin-lockout-threshold 3
    set admin-lockout-duration 300
    set pre_login_banner enable
    set strong-crypto enable
end

config system interface
    edit "port1"
        set ip 10.0.0.1 255.255.255.0
        set allowaccess ssh https
    next
end

config log syslogd setting
    set status enable
    set server "10.0.0.50"
    set mode udp
    set port 514
end
