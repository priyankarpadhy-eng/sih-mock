system {
    host-name SRX-SEC-CLEAN;
    time-zone UTC;
    login {
        message "AUTHORIZED ACCESS ONLY. Disconnect immediately if unapproved.";
        user secadmin {
            uid 2001;
            class super-user;
            authentication {
                encrypted-password "$6$rounds=5000$strongsalt$9K7mER7vX3Y80x1g0f7abcde12345";
            }
        }
        idle-timeout 10;
    }
    services {
        ssh {
            protocol-version v2;
            connection-limit 5;
            rate-limit 3;
        }
        web-management {
            https {
                port 443;
            }
        }
    }
    syslog {
        host 10.0.0.50 {
            any warning;
            authorization info;
        }
    }
}
