! ==============================================================================
! Gold-Standard Cisco CUCME Configuration Benchmark (SIH Problem Statement 26155)
! Target: Cisco 2911 Integrated Services Router with Cisco Unified Communications Manager Express
! Firmware: Cisco IOS Software, C2900 Software (C2900-UNIVERSALK9-M), Version 15.1(4)M4
! Non-Compliance Findings: Telnet active, Type 7 weak passwords, infinite exec-timeout, SNMP public
! ==============================================================================
version 15.1
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname CUCME-RTR-01
!
boot-start-marker
boot-end-marker
!
enable secret 5 $1$mER7$vX3Y80x1g0f7
enable password 7 0822455D0A16
!
no aaa new-model
!
ip source-route
ip cef
!
ip domain-name defense.mil
ip ssh version 1
!
telephony-service
 max-ephones 15
 max-dn 30
 ip source-address 192.168.1.1 port 2000
 auto assign 1 to 15
!
interface GigabitEthernet0/0
 description Primary Gateway Interface
 ip address 192.168.1.1 255.255.255.0
 duplex auto
 speed auto
 no shutdown
!
interface GigabitEthernet0/1
 description Voice VLAN Trunk
 ip address 10.10.10.1 255.255.255.0
 duplex auto
 speed auto
 no shutdown
!
snmp-server community public RO
snmp-server community private RW
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 exec-timeout 0 0
 password 7 0822455D0A16
 login
 transport input telnet ssh
line vty 5 15
 exec-timeout 0 0
 password 7 094F471A1A0A
 login
 transport input telnet
!
scheduler allocate 20000 1000
!
end
