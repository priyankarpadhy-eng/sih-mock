## ==============================================================================
## Juniper SRX Services Gateway Configuration Benchmark (JunOS 21.4R1)
## Target: Juniper SRX345 Branch Security Gateway
## Non-Compliance Findings: Telnet active, plaintext root password, default idle timeout missing
## ==============================================================================
system {
    host-name BGP-JUNOS-01;
    root-authentication {
        plain-text-password-with-yield "insecure_admin_pass";
    }
    services {
        ssh {
            protocol-version v1;
            max-sessions-per-connection 32;
        }
        telnet;
        web-management {
            http {
                interface ge-0/0/0.0;
            }
        }
    }
    login {
        message "UNAUTHORIZED ACCESS PROHIBITED. ALL ACTIVITIES MONITORED AND LOGGED.";
        user operator {
            uid 2001;
            class read-only;
            authentication {
                encrypted-password "$1$vX3Y$80x1g0f7mER7123";
            }
        }
    }
    syslog {
        archive size 100k files 3;
        user * {
            any emergency;
        }
        file messages {
            any notice;
            authorization info;
        }
    }
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 10.0.20.1/24;
            }
        }
    }
}
snmp {
    community public {
        authorization read-only;
    }
}
