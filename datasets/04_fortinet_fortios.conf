# ==============================================================================
# Fortinet FortiGate SASE Hub Benchmark (FortiOS 7.2)
# Target: FortiGate-100F Enterprise SASE Edge
# Non-Compliance Findings: Default admin timeout (zero), HTTP redirect disabled, default SNMP
# ==============================================================================
config system global
    set hostname "FG-SASE-HUB-01"
    set admintimeout 0
    set admin-sport 8443
    set admin-https-redirect disable
    set pre-login-banner disable
    set timezone 04
end
config system interface
    edit "port1"
        set vdom "root"
        set ip 10.0.40.1 255.255.255.0
        set allowaccess ping https ssh http telnet
        set type physical
        set snmp-index 1
    next
end
config system snmp community
    edit 1
        set name "public"
        config hosts
            edit 1
                set ip 0.0.0.0 0.0.0.0
            next
        end
    next
end
config log syslogd setting
    set status disable
end
